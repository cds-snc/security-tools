name: "Terragrunt plan sso proxy"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sso-proxy-terragrunt-plan.yml"
      - "terragrunt/*/sso_proxy/**"
      - "terragrunt/*/common/**"
      - "terragrunt/env/terragrunt.hcl"
      - "images/mirror.json"
      - ".github/workflows/sso-proxy-terragrunt-apply.yml"

env:
  AWS_REGION: ca-central-1
  CONFTEST_VERSION: 0.27.0
  TERRAFORM_VERSION: 1.15.5
  TERRAGRUNT_VERSION: 1.0.6
  TF_INPUT: false
  TF_VAR_google_client_id: ${{ secrets.SSO_PROXY_GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.SSO_PROXY_GOOGLE_CLIENT_SECRET }}
  TF_VAR_oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  oauth2-proxy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup Terraform tools
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0

      - name: Validate Terraform and protected routes without AWS credentials
        run: |
          set -euo pipefail
          validation_dir="${RUNNER_TEMP}/sso-proxy-validation"
          mkdir -p "${validation_dir}"
          cp terragrunt/aws/sso_proxy/*.tf "${validation_dir}/"
          cp -r terragrunt/aws/sso_proxy/tests "${validation_dir}/"
          cp terragrunt/env/common/{provider,common_variables}.tf "${validation_dir}/"
          cp terragrunt/env/sso_proxy/.terraform.lock.hcl "${validation_dir}/"
          terraform -chdir="${validation_dir}" init -backend=false -input=false
          terraform -chdir="${validation_dir}" validate
          if ! terraform -chdir="${validation_dir}" test -json -verbose > "${RUNNER_TEMP}/sso-proxy-tests.jsonl"; then
            jq -r 'select(.type == "diagnostic") | .["@message"]' "${RUNNER_TEMP}/sso-proxy-tests.jsonl"
            exit 1
          fi
          jq -r 'select(.type == "test_summary") | .["@message"]' "${RUNNER_TEMP}/sso-proxy-tests.jsonl"
          jq -r 'select(.type == "test_plan" and .["@testrun"] == "protected_routes")
            | .test_plan.resource_changes[]
            | select(.address == "aws_ecs_task_definition.oauth2_proxy")
            | .change.after.container_definitions' "${RUNNER_TEMP}/sso-proxy-tests.jsonl" \
            > "${RUNNER_TEMP}/sso-proxy-containers.json"
          jq -e 'length == 2' "${RUNNER_TEMP}/sso-proxy-containers.json"

      - name: Validate rendered commands with the pinned oauth2-proxy release
        env:
          GH_TOKEN: ${{ github.token }}
          OAUTH2_PROXY_CLIENT_ID: test-client
          OAUTH2_PROXY_CLIENT_SECRET: test-client-secret
          OAUTH2_PROXY_COOKIE_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          set -euo pipefail
          version="$(jq -er '.[] | select(.repo == "sso_proxy") | .version' images/mirror.json)"
          archive="oauth2-proxy-${version}.linux-amd64.tar.gz"
          gh release download "${version}" --repo oauth2-proxy/oauth2-proxy \
            --pattern "${archive}" --pattern "${archive}-sha256sum.txt" --dir "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}"
          sha256sum -c "${archive}-sha256sum.txt"
          tar xzf "${archive}"
          while IFS= read -r container; do
            mapfile -t args < <(jq -r '.command[]' <<< "${container}")
            "./oauth2-proxy-${version}.linux-amd64/oauth2-proxy" --config-test "${args[@]}"
          done < <(jq -c '.[]' sso-proxy-containers.json)

  terragrunt-plan:
    needs: oauth2-proxy-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup Terraform tools
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0

      - uses: cds-snc/paths-filter@b316143212d841aed668b7b29240c719d603a9b9 # v2.10.4
        id: filter
        with:
          filters: |
            sso_proxy:
              - 'terragrunt/aws/sso_proxy/**'
              - 'terragrunt/env/sso_proxy/**'
            common:
              - '.github/workflows/sso-proxy-terragrunt-apply.yml'
              - '.github/workflows/sso-proxy-terragrunt-plan.yml'
              - 'terragrunt/env/common/**'
              - 'terragrunt/env/terragrunt.hcl'
              - 'images/mirror.json'

      - name: configure aws credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/security-tools-plan
          role-session-name: TFPlan
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt plan sso_proxy
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.sso_proxy == 'true' || steps.filter.outputs.common == 'true' }}
        uses: cds-snc/terraform-plan@e08baaf605af7604ca7a138b6115be6dbd2882e8 # v5.0.5
        with:
          directory: "terragrunt/env/sso_proxy"
          comment-delete: "true"
          comment-title: "sso_proxy"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          terragrunt: "true"
