name: "Terragrunt apply sso proxy"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sso-proxy-terragrunt-apply.yml"
      - "terragrunt/*/sso_proxy/**"
      - "terragrunt/*/common/**"
      - "terragrunt/env/terragrunt.hcl"

env:
  AWS_REGION: ca-central-1
  CONFTEST_VERSION: 0.27.0
  TERRAFORM_VERSION: 1.15.5
  TERRAGRUNT_VERSION: 1.0.6
  TF_INPUT: false
  TF_VAR_google_client_id: ${{ secrets.SSO_PROXY_GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.SSO_PROXY_GOOGLE_CLIENT_SECRET }}
  TF_VAR_oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write
  checks: write
  statuses: write

jobs:
  terragrunt-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup Terraform tools
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0

      - name: configure aws credentials using OIDC
        uses: aws-actions/configure-aws-credentials@ffc08eae7350b1061d7de219e2135c75561fb680 # master
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/security-tools-apply
          role-session-name: TFApply
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify cutover prerequisites
        run: |
          set -euo pipefail
          if [[ -z "${TF_VAR_google_client_id}" || -z "${TF_VAR_google_client_secret}" || -z "${TF_VAR_oauth2_proxy_cookie_secret}" ]]; then
            echo "::error::Configure the Google client secrets and OAUTH2_PROXY_COOKIE_SECRET before cutover."
            exit 1
          fi
          entry="$(jq -ce '.[] | select(.repo == "sso_proxy")' images/mirror.json)"
          repository="security-tools/$(jq -r '.repo' <<< "${entry}")"
          source="$(jq -r '.source' <<< "${entry}")"
          digest="$(aws ecr describe-images --repository-name "${repository}" \
            --image-ids "imageDigest=${source##*@}" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ "${digest}" != "${source##*@}" ]]; then
            echo "::error::The mirrored oauth2-proxy digest does not match images/mirror.json. Run image mirroring before cutover."
            exit 1
          fi

      - name: Terragrunt apply sso proxy
        working-directory: "terragrunt/env/sso_proxy"
        run: terragrunt run --non-interactive -- apply -auto-approve
